---
# =============================================================================
# Smart Market — Production Inventory
# =============================================================================
# This file is committed with placeholder values.
# Replace vault_server_ip and ansible_ssh_private_key_file before first deploy.
#
# vault_server_ip is defined in ansible/group_vars/all/vault.yml (encrypted).
# This file should NOT contain the actual IP address in plaintext.
#
# USAGE
#   ansible-playbook -i inventories/production/hosts.yml bootstrap.yml
#   ansible-playbook -i inventories/production/hosts.yml site.yml
# =============================================================================

all:
  hosts:
    smartmarket_vps:
      # Host IP is stored in Ansible Vault to avoid committing server IP to
      # the repository. It is referenced via the vault variable here.
      ansible_host: "{{ vault_server_ip }}"

      # SSH connection settings.
      ansible_user:                 "{{ deploy_user }}"
      ansible_port:                 "{{ ssh_port }}"
      ansible_ssh_private_key_file: "{{ ansible_ssh_key_path }}"

      # Python interpreter path for Ubuntu 24.04.
      ansible_python_interpreter: /usr/bin/python3
