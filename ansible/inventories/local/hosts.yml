---
# =============================================================================
# Smart Market — Local Test Inventory
# =============================================================================
# For testing playbooks against a local VM (VirtualBox, UTM, Lima, etc.)
# before running against the production VPS.
#
# INTENDED USE
#   Provision a fresh Ubuntu 24.04 VM locally and point this inventory at it.
#   This allows full playbook validation — including SSH hardening, UFW, and
#   Docker installation — without touching the production server.
#
#   Do NOT use ansible_connection: local here. That bypasses SSH and would not
#   test the actual connection or hardening steps faithfully.
#
# SETUP
#   1. Create a local Ubuntu 24.04 VM (any hypervisor)
#   2. Note its IP address (e.g. 192.168.64.10 for Lima/UTM on macOS)
#   3. Replace the placeholder ansible_host value below
#   4. Ensure you can SSH to it as root or ubuntu before running bootstrap.yml
#
# USAGE
#   ansible-playbook -i inventories/local/hosts.yml \
#     --user root --ask-pass \
#     --ssh-extra-args='-o StrictHostKeyChecking=accept-new' \
#     bootstrap.yml
#
#   ansible-playbook -i inventories/local/hosts.yml site.yml
# =============================================================================

all:
  hosts:
    smartmarket_local_vm:
      ansible_host:                 "192.168.64.10"  # replace with your VM IP
      ansible_user:                 "{{ deploy_user }}"
      ansible_port:                 "{{ ssh_port }}"
      ansible_ssh_private_key_file: "{{ ansible_ssh_key_path }}"
      ansible_python_interpreter:   /usr/bin/python3
