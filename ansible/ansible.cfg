# =============================================================================
# Smart Market — Ansible Configuration
# =============================================================================
# Place this file in the ansible/ directory. Run all ansible-playbook commands
# from the ansible/ directory, or pass --playbook-dir explicitly.
#
# IMPORTANT: inventory is NOT set here. Always pass -i explicitly:
#   ansible-playbook -i inventories/production/hosts.yml site.yml
#
# Omitting a default inventory prevents accidental execution against the wrong
# environment (production vs local test VM).
# =============================================================================

[defaults]
# Roles resolved relative to this file's directory.
roles_path = ./roles

# Structured output — easier to read than the default 'minimal' callback.
stdout_callback = yaml

# Do not check host key on first connection. For first-run bootstrap against
# a new VPS, pass --ssh-extra-args='-o StrictHostKeyChecking=accept-new'
# on the command line. Leaving this True (default) is correct for production.
# host_key_checking = True   ← this is the default; do not set False in prod

# Vault password file. Uncomment and set to the path of your vault password
# file (never committed). Alternatively, use --vault-password-file on the CLI.
# vault_password_file = ../.vault_pass

[privilege_escalation]
become       = True
become_method = sudo
# become_ask_pass = False  ← deploy user has NOPASSWD sudo (set by bootstrap)

[ssh_connection]
# Multiplexing: reuse a single TCP connection per host within a run.
# Significantly speeds up multi-task playbooks.
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=30s

# Retry file location — keep out of repo root to avoid clutter.
# (ansible retries failed hosts; .retry files are git-ignored)
